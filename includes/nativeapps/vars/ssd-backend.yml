# Native (non-Docker) definition for ssd-backend — the API of the ssdv2 WebUI.
# Docker equivalent: the `ssd-backend` container in dockerapps/pretasks/webui.yml
# Upstream: github.com/laster13/ssd-backend  (a trimmed Riven fork, FastAPI +
# uvicorn, Poetry). Part of the `webui` bundle (vars/webui.yml).
#
# Native adjustments live in patch_ssd-backend.sh (post_fetch) — guarded, no-op
# on re-run, and re-applied automatically after every `git reset --hard` update.
# Settings/config are the app's own native JSON files under <data>/data/
# (settings.json, config.json, seasonarr.db) — no ansible inventory needed.
#
# Port 8091: 8080 is taken by the native Traefik dashboard.
name: ssd-backend
kind: python
python_version: "3.12"
repo: https://github.com/laster13/ssd-backend.git
ref: main
# dashboard sensor gauges, both sudoless on Apple Silicon:
#   smartmontools -> NVMe temp (`smartctl -A /dev/disk0`)
#   macmon        -> CPU temp + fan RPM (reads IOReport, no root)
brew_deps: smartmontools macmon
post_fetch: patch_ssd-backend.sh
build_cmd: pip install -q poetry && poetry install --only main --no-root
start_cmd: JWT_SECRET_KEY="$(cat __APP_DATA_DIR__/jwt_secret)" exec python -m uvicorn src.main:app --host 127.0.0.1 --port 8091 --log-level info
port: 8091
health_path: /openapi.json
data_dir: ssd-backend
env:
  PYTHONPATH: __APP_SRC_DIR__/src
  PYTHONUNBUFFERED: "1"
  SSD_DATA_DIR: __APP_DATA_DIR__/data
  DATABASE_URL: sqlite:///__APP_DATA_DIR__/data/seasonarr.db
  BACKEND_VERSION_PATH: __APP_SRC_DIR__/version.json
  BACKEND_SETTINGS_PATH: __APP_DATA_DIR__/data/settings.json
  FRONTEND_VERSION_PATH: __STORAGE_ROOT__/ssd-frontend/src/version.json
  SAISON_FRONTEND_VERSION_PATH: __STORAGE_ROOT__/saison-frontend/src/version.json
  # native replacements of ssd-frontend/scripts/*.sh (deploy/reinit/remove an app
  # via launchctl + install_native_app.sh instead of ansible/docker)
  SCRIPTS_DIR: __SETTINGS_SOURCE__/includes/nativeapps/scripts
  SETTINGS_SOURCE: __SETTINGS_SOURCE__
  SSD_NATIVE: "1"
  # arrs locaux. seasonarr : SONARR_URL (le fork la code en dur sur 172.17.0.1) ;
  # une instance est auto-créée depuis ~/.config/Sonarr/config.xml au 1er GET
  # /sonarr. Gestion média (symlinks/orphans) : host/port des arrs + les clés API
  # auto-remplies dans config.json depuis les config.xml (Radarr + Sonarr).
  SONARR_URL: http://127.0.0.1:8989
  RADARR_HOST: 127.0.0.1
  SONARR_HOST: 127.0.0.1
  RADARR_PORT: "7878"
  SONARR_PORT: "8989"
  # racine de la bibliothèque média (navigateur de dossiers de /settings/symlinks).
  # Défaut du fork : $HOME/Medias. SSD_MEDIA_DIR pour pointer ailleurs.
  #SSD_MEDIA_DIR: __HOME__/Medias
  LOG_LEVEL: INFO
  # Traefik web entrypoint is plain HTTP (127.0.0.1:8000) — Secure cookies would
  # be dropped by the browser and the seasonarr login/onboarding would loop.
  COOKIE_SECURE: "false"
