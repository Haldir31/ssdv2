# Native (non-Docker) definition for MediaFlow Proxy.
# Docker equivalent: includes/dockerapps/vars/mediaflowproxy.yml
#   (image mhdzumair/mediaflow-proxy + a redis-mediaflowproxy sidecar)
# Upstream: github.com/mhdzumair/mediaflow-proxy — FastAPI, PEP-621/hatchling,
# Python >= 3.10. High-perf proxy for HLS / MPEG-DASH / HTTP(S) streams with
# real-time DRM decryption; consumed by StreamFusion / AIOStreams / Stremio.
#
# Port 8888 (free here). API_PASSWORD is generated once by gen_secret.sh and
# read at launch — streaming clients pass it as the `api_password` query param
# (there is no browser-auth middleware, same as the Docker labels' chain-no-auth).
# Redis is OPTIONAL (redis_url unset = disabled); we point it at the shared
# native Redis (db 7) for cross-worker locking/caching of the prebuffer.
name: mediaflowproxy
kind: python
python_version: "3.12"
repo: https://github.com/mhdzumair/mediaflow-proxy.git
ref: main
post_fetch: gen_secret.sh
build_cmd: pip install -q .
start_cmd: API_PASSWORD="$(cat __APP_DATA_DIR__/secret_key)" exec python -m gunicorn mediaflow_proxy.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 127.0.0.1:8888 --timeout 120 --max-requests 500 --max-requests-jitter 200 --forwarded-allow-ips 127.0.0.1 --log-level info
port: 8888
health_path: /
data_dir: mediaflowproxy
env:
  PORT: "8888"
  REDIS_URL: redis://127.0.0.1:6379/7
  FORWARDED_ALLOW_IPS: 127.0.0.1
  M3U8_CONTENT_ROUTING: mediaflow
  ENABLE_HLS_PREBUFFER: "true"
  ENABLE_DASH_PREBUFFER: "true"
  ENABLE_ACESTREAM: "false"
  ENABLE_TELEGRAM: "false"
  DISABLE_DOCS: "true"
  DISABLE_SPEEDTEST: "true"
  LOG_LEVEL: INFO
