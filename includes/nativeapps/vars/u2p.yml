# UTOPEER / athanor — decentralised Nostr content indexer  (u2p.network)
# Upstream: https://git.u2p.network/u2p/u2p-node  (Go 1.25 backend + SvelteKit
#   frontend embedded → one binary). Torznab API at /api/torznab (Prowlarr /
#   *arr compatible). Setup wizard at the web UI on first run: identity (Nostr
#   keypair), relay preset, optional TMDB/OMDB enrichment keys.
#
# Config: PostgreSQL driver (native postgresql@18, role+db `athanor`; the
#   SQLite path hits an Atlas FTS5 shadow-table diff bug). Embedded Khatru
#   Nostr relay moved off :9998 (c411-proxy) to :39998. Telemetry mode=test
#   (noop OTel, no export). Curator + Meilisearch OFF (both optional — SQL
#   search fallback; the curator is a separate Python microservice).
#   Tor is MANDATORY (hard killswitch, no disable) -> native `com.haldir.tor`
#   (SOCKS 127.0.0.1:9050, control 9051, cookie auth).
# First-run: open https://u2p.jmiflix.fr and complete the wizard.
name: u2p
kind: go
repo: https://git.u2p.network/u2p/u2p-node.git
ref: main
post_fetch: patch_u2p.sh
build_cmd: cd web && pnpm install && pnpm run build && cd .. && rm -rf internal/api/static && cp -r web/build internal/api/static && CGO_ENABLED=0 go build -trimpath -ldflags "-w -s -X athanor/internal/buildmeta.Version=main-$(git rev-parse --short HEAD) -X athanor/internal/buildmeta.Commit=$(git rev-parse --short HEAD) -X athanor/internal/buildmeta.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X athanor/internal/buildmeta.CuratorCommit=$(git rev-parse --short HEAD:curator 2>/dev/null || echo unknown)" -o u2p ./cmd/athanor
start_cmd: ./u2p
port: 9999
health_path: /
data_dir: u2p
env:
  ATHANOR_DATA_DIR: __APP_DATA_DIR__
  ATHANOR_SERVER_HOST: 127.0.0.1
  ATHANOR_SERVER_PORT: "9999"
  ATHANOR_RELAY_LISTEN: 127.0.0.1:39998
  ATHANOR_TELEMETRY_MODE: test
  ATHANOR_TOR_SOCKS_ADDR: 127.0.0.1:9050
  ATHANOR_TOR_CONTROL_ADDR: 127.0.0.1:9051
  ATHANOR_TOR_CONTROL_COOKIE: /Users/haldir/seedbox/native/tor/control.authcookie
  ATHANOR_TOR_HOSTNAME_FILE: __APP_DATA_DIR__/onion_hostname
  ATHANOR_DATABASE_DRIVER: postgres
  ATHANOR_DATABASE_POSTGRES_HOST: 127.0.0.1
  ATHANOR_DATABASE_POSTGRES_PORT: "5432"
  ATHANOR_DATABASE_POSTGRES_DATABASE: athanor
  ATHANOR_DATABASE_POSTGRES_USER: athanor
  ATHANOR_DATABASE_POSTGRES_PASSWORD: __SECRET__
  ATHANOR_DATABASE_POSTGRES_SSLMODE: disable
  ATHANOR_CURATOR_ENABLED: "false"
  # Dashboard login (server.admin_username / server.admin_password). Default is
  # admin/admin and config.yaml reverts on every reinstall, so pin it here.
  # Password from native-secrets/u2p.env. Set BOTH to "-" to disable auth.
  ATHANOR_SERVER_ADMIN_USERNAME: "haldir"
  ATHANOR_SERVER_ADMIN_PASSWORD: __SECRET__
  # Meili ON so the Settings page loads (it hard-fails on a 503 from /meili/status).
  # OWN index name — NOT reborn's "torrents" index (native com.haldir.meilisearch).
  ATHANOR_MEILISEARCH_ENABLED: "true"
  ATHANOR_MEILISEARCH_URL: http://127.0.0.1:7700
  ATHANOR_MEILISEARCH_API_KEY: __SECRET__
  ATHANOR_MEILISEARCH_INDEX_NAME: athanor_torrents
  # Sync throughput tuning (defaults 100 MB/h + 1000 events/relay + 3 concurrent
  # are far too low to pull a large single-relay catalogue like the YGG-FR mirror).
  # DO NOT set ATHANOR_DISCOVERY_ENABLED=false — it hangs athanor's startup
  # (active-set manager depends on the discovery subsystem).
  ATHANOR_ACTIVE_SET_SYNC_BUDGET_MB_PER_HOUR: "8000"
  ATHANOR_RELAY_SYNC_MAX_EVENTS_PER_RELAY: "200000"
  ATHANOR_INDEXER_MAX_CONCURRENT_SYNCS: "20"
  # httprate LimitByIP keys on RemoteAddr (chi.RealIP is intentionally absent), so
  # behind the CF tunnel + Traefik every user shares one IP -> ip_per_minute is a
  # GLOBAL request cap. The default 1000 made the SvelteKit dashboard (polling
  # tiers 3/10/30/60s across many widgets + tabs) throw "Too Many Requests".
  ATHANOR_OPERATIONAL_RATE_LIMITS_IP_PER_MINUTE: "20000"
  ATHANOR_OPERATIONAL_RATE_LIMITS_API_KEY_PER_MINUTE: "20000"
